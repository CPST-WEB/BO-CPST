<script>
  // ========= CONFIG SUPABASE =========
  const SUPABASE_URL = "https://ltymaadmjdqpvmpjbxbr.supabase.co";
  const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0eW1hYWRtamRxcHZtcGpieGJyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMxNTUxMjYsImV4cCI6MjA3ODczMTEyNn0.K7f-eB2mVd-2lomo9-qI4xWW7X3sFDOzx1ukB4OAgmo";

  const TABLE_NAME = "courriers";
  const BUCKET_ARR = "bo_pj_arr";
  const BUCKET_DEP = "bo_pj_dep";

  const { createClient } = supabase;
  const supa = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ========= PROFILS UTILISATEURS =========
  const USER_PROFILES = {
    "bo@cpst.ma": {
      label: "BUREAU D'ORDRE",
      service: "SECRETARIAT",
      canSeeAll: true,
      canEdit: true, // seul BO peut éditer
    },
    "dgs@cpst.ma": {
      label: "DGS",
      service: "DGS",
      canSeeAll: true,
      canEdit: false,
    },
    "presidente@cpst.ma": {
      label: "PRÉSIDENTE",
      service: "PRESIDENCE",
      canSeeAll: true,
      canEdit: false,
    },
    "secretariat@cpst.ma": {
      label: "SECRETARIAT",
      service: "SECRETARIAT",
      canSeeAll: false,
      canEdit: false,
    },
    "dapc@cpst.ma": {
      label: "DAPC",
      service: "DAPC",
      canSeeAll: false,
      canEdit: false,
    },
    "safp@cpst.ma": {
      label: "SAFP",
      service: "SAFP",
      canSeeAll: false,
      canEdit: false,
    },
    "smcsc@cpst.ma": {
      label: "SMCSC",
      service: "SMCSC",
      canSeeAll: false,
      canEdit: false,
    },
    "satde@cpst.ma": {
      label: "SATDE",
      service: "SATDE",
      canSeeAll: false,
      canEdit: false,
    },
    "bgpa@cpst.ma": {
      label: "BGPA",
      service: "BGPA",
      canSeeAll: false,
      canEdit: false,
    },
    "bga@cpst.ma": {
      label: "BGA",
      service: "BGA",
      canSeeAll: false,
      canEdit: false,
    },
    "srhaj@cpst.ma": {
      label: "SRHAJ",
      service: "SRHAJ",
      canSeeAll: false,
      canEdit: false,
    },
    "bid@cpst.ma": {
      label: "BID",
      service: "BID",
      canSeeAll: false,
      canEdit: false,
    },
  };

  let currentUser = null;
  let currentProfile = null;
  let currentType = "ARRIVEE"; // ARRIVEE ou DEPART
  let isSaving = false;

  // ========= GESTION UI =========
  function showError(msg) {
    const box = document.getElementById("globalError");
    if (!msg) {
      box.classList.add("hidden");
      box.textContent = "";
      return;
    }
    box.textContent = msg;
    box.classList.remove("hidden");
  }

  function setLoading(loading) {
    isSaving = loading;
    document.getElementById("btnSave").disabled = loading;
    const spinner = document.getElementById("spinner");
    if (loading) spinner.classList.remove("hidden");
    else spinner.classList.add("hidden");
  }

  function resetForm() {
    document.getElementById("courrierForm").reset();
    document.getElementById("typeCourrier").value = currentType;
    const today = new Date().toISOString().slice(0, 10);
    document.getElementById("date").value = today;
    applyServiceLock();
  }

  function setType(type) {
    currentType = type;
    document.getElementById("typeCourrier").value = type;

    const tabArr = document.getElementById("tabArrivee");
    const tabDep = document.getElementById("tabDepart");
    const labelListe = document.getElementById("labelListe");

    if (type === "ARRIVEE") {
      tabArr.classList.add("bg-slate-800", "text-white");
      tabArr.classList.remove("text-slate-700", "bg-white");
      tabDep.classList.remove("bg-slate-800", "text-white");
      tabDep.classList.add("text-slate-700", "bg-white");
      labelListe.textContent = "Arrivée";
    } else {
      tabDep.classList.add("bg-slate-800", "text-white");
      tabDep.classList.remove("text-slate-700", "bg-white");
      tabArr.classList.remove("bg-slate-800", "text-white");
      tabArr.classList.add("text-slate-700", "bg-white");
      labelListe.textContent = "Départ";
    }

    loadCourriers();
  }

  function updateCount(count) {
    document.getElementById("countBadge").textContent = count + " enreg.";
    document.getElementById("statTotal").textContent = count;
    document.getElementById("statService").textContent =
      currentProfile && currentProfile.canSeeAll
        ? "Tous"
        : currentProfile?.service || "–";
  }

  function clearDateFilters() {
    document.getElementById("filterDateFrom").value = "";
    document.getElementById("filterDateTo").value = "";
    loadCourriers();
  }

  function applyServiceLock() {
    const serviceSelect = document.getElementById("service");
    const info = document.getElementById("serviceInfo");
    if (!currentProfile) return;

    if (!currentProfile.canSeeAll && currentProfile.service) {
      serviceSelect.value = currentProfile.service;
      serviceSelect.disabled = true;
      info.textContent =
        "Votre service est fixé à " + currentProfile.service + ".";
    } else {
      serviceSelect.disabled = false;
      info.textContent =
        "DGS / PRÉSIDENTE peuvent choisir n'importe quel service.";
    }
  }

  function toggleEditRights() {
    const canEdit = !!(currentProfile && currentProfile.canEdit);
    const btnSave = document.getElementById("btnSave");
    if (btnSave) {
      btnSave.classList.toggle("hidden", !canEdit);
    }
  }

  // ========= AUTH =========
  function setSession(user) {
    currentUser = user || null;
    const app = document.getElementById("app");
    const loginArea = document.getElementById("loginArea");

    if (currentUser) {
      const profile =
        USER_PROFILES[currentUser.email] || {
          label: currentUser.email,
          service: null,
          canSeeAll: true,
          canEdit: false,
        };

      currentProfile = profile;

      document.getElementById("currentUserLabel").textContent =
        profile.label +
        (profile.service ? " (" + profile.service + ")" : "");

      loginArea.classList.add("hidden");
      app.classList.remove("hidden");

      applyServiceLock();
      toggleEditRights();
    } else {
      currentProfile = null;
      app.classList.add("hidden");
      loginArea.classList.remove("hidden");
    }
  }

  async function handleLogin(event) {
    event.preventDefault();
    document.getElementById("loginError").classList.add("hidden");
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    document.getElementById("btnLogin").disabled = true;

    const { data, error } = await supa.auth.signInWithPassword({
      email,
      password,
    });

    document.getElementById("btnLogin").disabled = false;

    if (error) {
      const box = document.getElementById("loginError");
      box.textContent = "Connexion impossible : " + error.message;
      box.classList.remove("hidden");
      return;
    }

    setSession(data.user);
    loadCourriers(); // on recharge la liste après connexion
  }

  async function handleLogout() {
    await supa.auth.signOut();
    setSession(null);
  }

  // ========= CHARGER LA LISTE =========
  async function loadCourriers() {
    if (!currentUser) return;

    showError("");
    const tbody = document.getElementById("courriersBody");
    tbody.innerHTML = `
      <tr>
        <td colspan="7" class="px-3 py-3 text-center text-xs text-slate-400">
          Chargement en cours...
        </td>
      </tr>
    `;

    try {
      let query = supa
        .from(TABLE_NAME)
        .select("*")
        .eq("type", currentType)
        .order("date", { ascending: false });

      const from = document.getElementById("filterDateFrom").value;
      const to = document.getElementById("filterDateTo").value;
      if (from) query = query.gte("date", from);
      if (to) query = query.lte("date", to);

      const { data, error } = await query;

      if (error) {
        console.error(error);
        showError("Erreur lors du chargement des courriers : " + error.message);
        tbody.innerHTML = "";
        updateCount(0);
        return;
      }

      let filtered = data || [];
      if (currentProfile && !currentProfile.canSeeAll && currentProfile.service) {
        filtered = filtered.filter(
          (row) => (row.service || "") === currentProfile.service
        );
      }

      if (!filtered.length) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="px-3 py-3 text-center text-xs text-slate-400">
              Aucun courrier trouvé.
            </td>
          </tr>
        `;
        updateCount(0);
        return;
      }

      updateCount(filtered.length);
      tbody.innerHTML = "";

      for (const row of filtered) {
        const numero = row.numero || "";
        const dateC = row.date || "";
        const service = row.service || "";
        const objet = row.objet || "";
        const expDest =
          currentType === "ARRIVEE"
            ? row.expediteur || ""
            : row.destinataire || "";
        const pjPath = row.piece_jointe_url || null;
        const bucket = currentType === "ARRIVEE" ? BUCKET_ARR : BUCKET_DEP;

        let pjLinkHtml = "-";
        if (pjPath) {
          const { data: pub, error: urlErr } = await supa.storage
            .from(bucket)
            .createSignedUrl(pjPath, 60 * 60); // 1 heure

          if (!urlErr && pub && pub.signedUrl) {
            pjLinkHtml = `<a href="${pub.signedUrl}" target="_blank" class="text-xs text-slate-700 underline">Ouvrir</a>`;
          }
        }

        const canEdit = currentProfile && currentProfile.canEdit;
        const deleteHtml = canEdit
          ? `<button class="text-[11px] text-red-600 hover:underline"
                     onclick="deleteCourrier('${row.id}')">
               Supprimer
             </button>`
          : "";

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="px-2 py-2 align-top">${numero}</td>
          <td class="px-2 py-2 align-top">${dateC}</td>
          <td class="px-2 py-2 align-top">${service}</td>
          <td class="px-2 py-2 align-top max-w-xs">
            <div class="line-clamp-2">${objet}</div>
          </td>
          <td class="px-2 py-2 align-top max-w-xs">
            <div class="line-clamp-2">${expDest}</div>
          </td>
          <td class="px-2 py-2 align-top text-center">
            ${pjLinkHtml}
          </td>
          <td class="px-2 py-2 align-top text-center">
            ${deleteHtml}
          </td>
        `;
        tbody.appendChild(tr);
      }
    } catch (err) {
      console.error(err);
      showError("Impossible de contacter Supabase (réseau) : " + err.message);
      tbody.innerHTML = "";
      updateCount(0);
    }
  }

  // ========= ENREGISTRER =========
  async function handleSubmit(event) {
    event.preventDefault();
    if (!currentUser || isSaving) return;

    if (!currentProfile || !currentProfile.canEdit) {
      showError("Vous n'avez pas le droit d'enregistrer un courrier.");
      return;
    }

    showError("");

    const type = currentType;
    const numero = (document.getElementById("numero").value || "").trim();
    const date = document.getElementById("date").value;
    const serviceSelect = document.getElementById("service");
    let service = serviceSelect.value;
    const objet = (document.getElementById("objet").value || "").trim();
    const exp_dest = (document.getElementById("exp_dest").value || "").trim();
    const observations =
      (document.getElementById("observations").value || "").trim();
    const fileInput = document.getElementById("pj");
    const file = fileInput.files[0] || null;

    if (!numero || !date || !service || !objet || !exp_dest) {
      showError("Merci de remplir tous les champs obligatoires (*).");
      return;
    }

    if (currentProfile && !currentProfile.canSeeAll && currentProfile.service) {
      service = currentProfile.service;
    }

    setLoading(true);

    const { data: existing, error: existErr } = await supa
      .from(TABLE_NAME)
      .select("id, numero")
      .eq("type", type)
      .eq("numero", numero);

    if (existErr) {
      console.error(existErr);
      showError(
        "Erreur lors de la vérification du numéro : " + existErr.message
      );
      setLoading(false);
      return;
    }

    if (existing && existing.length > 0) {
      showError(
        "Ce numéro d'ordre existe déjà pour les courriers de type " + type + "."
      );
      setLoading(false);
      return;
    }

    let pjPath = null;
    if (file) {
      const bucketName = type === "ARRIVEE" ? BUCKET_ARR : BUCKET_DEP;
      const uniqueName =
        Date.now() + "_" + file.name.replace(/\s+/g, "_");
      const { data: upData, error: upErr } = await supa.storage
        .from(bucketName)
        .upload(uniqueName, file);

      if (upErr) {
        console.error(upErr);
        showError(
          "Erreur lors de l'upload de la pièce jointe : " + upErr.message
        );
        setLoading(false);
        return;
      }
      pjPath = upData.path;
    }

    const insertPayload = {
      type,
      numero,
      date,
      service,
      objet,
      observations,
      piece_jointe_url: pjPath,
    };

    if (type === "ARRIVEE") {
      insertPayload.expediteur = exp_dest;
      insertPayload.destinataire = "";
    } else {
      insertPayload.expediteur = "";
      insertPayload.destinataire = exp_dest;
    }

    const { error } = await supa.from(TABLE_NAME).insert(insertPayload);

    setLoading(false);

    if (error) {
      console.error(error);
      showError("Erreur lors de l'enregistrement : " + error.message);
      return;
    }

    resetForm();
    loadCourriers();
  }

  // ========= SUPPRIMER =========
  async function deleteCourrier(id) {
    if (!currentUser) return;
    if (!currentProfile || !currentProfile.canEdit) {
      alert("Vous n'avez pas le droit de supprimer un courrier.");
      return;
    }
    if (!confirm("Supprimer définitivement ce courrier ?")) return;

    showError("");

    const { error } = await supa
      .from(TABLE_NAME)
      .delete()
      .eq("id", id);

    if (error) {
      console.error(error);
      showError("Erreur lors de la suppression : " + error.message);
      return;
    }

    loadCourriers();
  }

  // ========= INIT =========
  document.addEventListener("DOMContentLoaded", async () => {
    const today = new Date().toISOString().slice(0, 10);
    document.getElementById("date").value = today;

    const { data } = await supa.auth.getUser();
    setSession(data?.user ?? null);

    setType("ARRIVEE");
  });
</script>
