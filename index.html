function applyRole() {

function loginUser() {

/* ============================
   LECTURE / ECRITURE COURRIERS
   (TABLE 'courriers')
   ============================ */

async function loadCourriersFromSupabase() {
  try {
    const { data, error } = await supabaseClient
      .from("courriers")
      .select("*")
      .order("date", { ascending: true })
      .order("numero", { ascending: true });

    if (error) {
      console.error(error);
      alert("Erreur lors du chargement des courriers depuis Supabase.");
      return;
    }

    ROWS = data || [];
    renderAll();
  } catch (err) {
    console.error(err);
    alert("Erreur inattendue lors du chargement des courriers.");
  }
}

async function saveCourrierToSupabase(f) {
  // f contient toutes les infos du courrier
  const payload = {
    type:         f.type,
    numero:       f.numero,
    date:         f.date || null,
    expediteur:   f.expediteur || null,
    destinataire: f.destinataire || null,
    objet:        f.objet || null,
    service:      f.service || null,
    priorite:     f.priorite || null,
    echeance:     f.echeance || null,
    statut:       f.statut || null,
    instructions: f.instructions || null,
    observation:  f.observation || null,
    reference:    f.reference || null
  };

  try {
    if (f.id) {
      // UPDATE
      const { error } = await supabaseClient
        .from("courriers")
        .update(payload)
        .eq("id", f.id);

      if (error) {
        console.error(error);
        alert("Erreur lors de la mise à jour du courrier.");
        return null;
      }
      return f;
    } else {
      // INSERT
      const { data, error } = await supabaseClient
        .from("courriers")
        .insert(payload)
        .select()
        .single();

      if (error) {
        console.error(error);
        alert("Erreur lors de la création du courrier.");
        return null;
      }
      return data; // contient id généré
    }
  } catch (err) {
    console.error(err);
    alert("Erreur inattendue lors de l'enregistrement du courrier.");
    return null;
  }
}

async function deleteCourrierFromSupabase(id) {
  try {
    const { error } = await supabaseClient
      .from("courriers")
      .delete()
      .eq("id", id);

    if (error) {
      console.error(error);
      alert("Erreur lors de la suppression du courrier.");
    }
  } catch (err) {
    console.error(err);
    alert("Erreur inattendue lors de la suppression du courrier.");
  }
}

/* ============================
   GESTION PIECES JOINTES
   (STOCKAGE SUPABASE)
   ============================ */
/*
Principe simple :
- Bucket bo_pj_arr : PDF d'arrivée
- Bucket bo_pj_dep : PDF de départ
- Nom du fichier = numero + ".pdf" (ex : 25.pdf)
*/

async function uploadAttachmentIfAny(f, fileInput) {
  if (!fileInput || !fileInput.files || !fileInput.files.length) return;

  const file = fileInput.files[0];
  if (!file) return;

  if (!f.numero) {
    alert("Numéro d'enregistrement manquant pour nommer la pièce jointe.");
    return;
  }

  const isEntrant = f.type === "entrant";
  const bucket = isEntrant ? BUCKET_ARRIVEES : BUCKET_DEPARTS;
  const path = `${f.numero}.pdf`; // 25 -> 25.pdf

  try {
    const { error } = await supabaseClient
      .storage
      .from(bucket)
      .upload(path, file, { upsert: true });

    if (error) {
      console.error(error);
      alert("Pièce jointe : erreur lors de l'envoi vers Supabase.");
    } else {
      console.log("Pièce jointe envoyée sur", bucket, "->", path);
    }
  } catch (err) {
    console.error(err);
    alert("Pièce jointe : erreur inattendue lors de l'envoi.");
  }
}

async function viewPieces(row) {
  if (!row || !row.numero) {
    alert("Aucune pièce jointe (numéro manquant).");
    return;
  }

  const isEntrant = row.type === "entrant";
  const bucket = isEntrant ? BUCKET_ARRIVEES : BUCKET_DEPARTS;
  const path = `${row.numero}.pdf`;

  const { data } = supabaseClient
    .storage
    .from(bucket)
    .getPublicUrl(path);

  const publicUrl = data && data.publicUrl ? data.publicUrl : null;

  const wrap = document.createElement("div");

  if (!publicUrl) {
    const msg = document.createElement("div");
    msg.className = "text-sm text-slate-500";
    msg.textContent = "Aucune pièce jointe trouvée pour ce courrier.";
    wrap.appendChild(msg);
  } else {
    const label = document.createElement("div");
    label.className = "mb-2 text-sm font-semibold text-slate-700";
    label.textContent = `Pièce jointe : ${row.numero}.pdf (${isEntrant ? "Arrivée" : "Départ"})`;
    wrap.appendChild(label);

    const viewer = document.createElement("div");
    viewer.className =
      "border border-slate-200 rounded-xl overflow-hidden bg-white";

    const emb = document.createElement("embed");
    emb.src = publicUrl;
    emb.type = "application/pdf";
    emb.style.width = "100%";
    emb.style.height = "480px";

    viewer.appendChild(emb);
    wrap.appendChild(viewer);
  }

  openModal("Pièce jointe", wrap);
}

/* ============================
   STATS
   ============================ */

function renderStats() {
  const r = ROWS;
  const total = r.length;
  const entrants = r.filter(x => x.type === "entrant").length;
  const sortants = r.filter(x => x.type === "sortant").length;
  const enTrait = r.filter(x => x.statut === "En traitement").length;
  const urg = r.filter(x => x.priorite && x.priorite !== "Normal").length;
  const late = r.filter(x =>
    x.echeance && new Date(x.echeance) < new Date()
  ).length;

  function bloc(label, value) {
    return `
      <div class="card flex flex-col gap-1">
        <div class="text-[10px] uppercase tracking-wide text-slate-500">${label}</div>
        <div class="text-2xl font-bold text-slate-900">${value}</div>
      </div>`;
  }

  const stats = document.getElementById("stats");
  if (!stats) return;

  stats.innerHTML =
    bloc("Total", total) +
    bloc("Entrants", entrants) +
    bloc("Sortants", sortants) +
    bloc("En traitement", enTrait) +
    bloc("Urgents", urg) +
    bloc("Échéances dépassées", late);
}

/* ============================
   TABLEAU
   ============================ */

function dangerDate(echeance) {
  if (!echeance) return "";
  const d = new Date(echeance);
  const now = new Date();
  const diff = (d - now) / (1000 * 3600 * 24);
  if (isNaN(diff)) return "";
  if (diff < 0) return "bg-red-50";
  if (diff <= 3) return "bg-amber-50";
  return "";
}

function renderTable() {
  const tb = document.getElementById("tbody");
  if (!tb) return;

  const fText = ($("#search")?.value || "").toLowerCase();
  const fType = $("#filterType")?.value || "";
  const fService = $("#filterService")?.value || "";
  const fDate = $("#filterDate")?.value || "";

  let rows = ROWS.slice();

  if (fType) {
    rows = rows.filter(r => r.type === fType);
  }

  if (fService) {
    rows = rows.filter(r => (r.service || "") === fService);
  }

  if (fDate) {
    rows = rows.filter(r => (r.date || "") === fDate);
  }

  if (fText) {
    rows = rows.filter(r => {
      return (
        (r.objet || "").toLowerCase().includes(fText) ||
        (r.numero || "").toLowerCase().includes(fText) ||
        (r.expediteur || "").toLowerCase().includes(fText) ||
        (r.destinataire || "").toLowerCase().includes(fText) ||
        (r.reference || "").toLowerCase().includes(fText)
      );
    });
  }

  tb.innerHTML = "";

  if (!rows.length) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 11;
    td.className = "p-8 text-center text-sm text-slate-500";
    td.textContent = "Aucun courrier pour l’instant.";
    tr.appendChild(td);
    tb.appendChild(tr);
    return;
  }

  rows.forEach(r => {
    const tr = document.createElement("tr");
    tr.className = dangerDate(r.echeance);

    function addCell(v) {
      const td = document.createElement("td");
      td.className = "tbl-td";
      td.textContent = v || "";
      tr.appendChild(td);
    }

    addCell(r.type === "entrant" ? "Entrant" : "Sortant");
    addCell(r.numero || "");
    addCell(r.date || "");
    addCell(
      r.type === "entrant"
        ? (r.expediteur || "-")
        : (r.destinataire || "-")
    );
    addCell(r.objet || "");
    addCell(r.service || "");
    addCell(r.priorite || "");
    addCell(r.echeance || "-");
    addCell(r.statut || "");

    // Pièces
    const tdP = document.createElement("td");
    tdP.className = "tbl-td no-print";
    const link = document.createElement("a");
    link.href = "#";
    link.textContent = "Voir";
    link.className = "text-blue-600 underline";
    link.onclick = ev => { ev.preventDefault(); viewPieces(r); };
    tdP.appendChild(link);
    tr.appendChild(tdP);

    // Actions
    const tdA = document.createElement("td");
    tdA.className = "tbl-td no-print";

    if (CAN_EDIT) {
      const e1 = document.createElement("a");
      e1.href = "#";
      e1.textContent = "Modifier";
      e1.className = "text-blue-600 underline mr-3";
      e1.onclick = ev => { ev.preventDefault(); openForm(r); };

      const e2 = document.createElement("a");
      e2.href = "#";
      e2.textContent = "Supprimer";
      e2.className = "text-red-600 underline";
      e2.onclick = async ev => {
        ev.preventDefault();
        if (confirm("Supprimer ce courrier ?")) {
          await deleteCourrierFromSupabase(r.id);
          await loadCourriersFromSupabase();
        }
      };

      tdA.appendChild(e1);
      tdA.appendChild(e2);
    } else {
      tdA.textContent = "-";
      tdA.classList.add("text-slate-400");
    }

    tr.appendChild(tdA);
    tb.appendChild(tr);
  });
}

function renderAll() {
  renderStats();
  renderTable();
}

/* ============================
   MODAL GÉNÉRIQUE
   ============================ */

function openModal(title, contentEl) {
  const old = document.getElementById("__modal");
  if (old) old.remove();

  const modal = document.createElement("div");
  modal.id = "__modal";
  modal.className = "fixed inset-0 z-50";

  modal.innerHTML = `
    <div class="absolute inset-0" style="background:#1f2937;opacity:.78;"></div>
    <div class="absolute inset-0 flex items-center justify-center p-4">
      <div class="card w-full max-w-6xl max-h-[92vh] overflow-auto bg-slate-50">
        <div class="flex items-center justify-between gap-3 mb-3">
          <h3 class="text-lg font-semibold text-slate-900">${title}</h3>
          <button class="btn btn-ghost" id="btnCloseModal">Fermer</button>
        </div>
        <div id="modalContent"></div>
      </div>
    </div>
  `;

  document.body.appendChild(modal);
  const c = document.getElementById("modalContent");
  c.appendChild(contentEl);

  document.getElementById("btnCloseModal").onclick = () => modal.remove();
  modal.firstChild.onclick = () => modal.remove();
}

/* ============================
   FORMULAIRE NOUVEAU / EDIT
   ============================ */

function openForm(initial) {
  if (!CAN_EDIT) return;

  const f = initial
    ? { ...initial }
    : {
        id: null,
        type: "entrant",
        numero: "",
        date: new Date().toISOString().slice(0,10),
        expediteur: "",
        destinataire: "",
        objet: "",
        instructions: "",
        service: "",
        priorite: "Normal",
        echeance: "",
        statut: "Reçu",
        observation: "",
        reference: ""
      };

  const grid = document.createElement("div");
  grid.className = "grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-3";

  // Bandeau type
  const typeBox = document.createElement("div");
  typeBox.className =
    "lg:col-span-4 md:col-span-3 border-2 border-blue-300 bg-blue-50 p-3 rounded-xl";
  typeBox.innerHTML = `
    <div class="font-semibold text-blue-900 mb-1 text-sm">
      Type de courrier
    </div>
    <div class="flex flex-wrap gap-3">
      <button type="button" id="btnEntrant" class="btn btn-toggle">
        Entrant (Arrivée)
      </button>
      <button type="button" id="btnSortant" class="btn btn-toggle">
        Sortant (Départ)
      </button>
    </div>
  `;
  grid.appendChild(typeBox);

  grid.innerHTML += `
    <div>
      <div class="label">N° d'enregistrement</div>
      <input id="f_numero" class="input" />
    </div>
    <div>
      <div class="label">Date</div>
      <input id="f_date" type="date" class="input" />
    </div>
    <div>
      <div class="label" id="lblPerson">Expéditeur</div>
      <input id="f_person" class="input" />
    </div>
    <div>
      <div class="label">Service destinataire</div>
      <input id="f_service" class="input" />
    </div>
    <div>
      <div class="label">Priorité</div>
      <select id="f_priorite" class="input">
        <option>Normal</option>
        <option>Urgent</option>
        <option>Très urgent</option>
      </select>
    </div>
    <div>
      <div class="label">Échéance</div>
      <input id="f_echeance" type="date" class="input" />
    </div>
    <div>
      <div class="label">Statut</div>
      <select id="f_statut" class="input">
        <option>Reçu</option>
        <option>Enregistré</option>
        <option>Distribué</option>
        <option>En traitement</option>
        <option>Répondu</option>
        <option>Clos</option>
      </select>
    </div>
    <div class="lg:col-span-4 md:col-span-3">
      <div class="label">Objet</div>
      <textarea id="f_objet" class="input input-lg" rows="3"></textarea>
    </div>
    <div class="lg:col-span-4 md:col-span-3">
      <div class="label">Instructions</div>
      <textarea id="f_instructions" class="input" rows="2"></textarea>
    </div>
    <div>
      <div class="label">Référence</div>
      <input id="f_reference" class="input" />
    </div>
    <div>
      <div class="label">Observations</div>
      <input id="f_obs" class="input" />
    </div>
    <div class="lg:col-span-4 md:col-span-3">
      <div class="label">Pièces jointes (PDF)</div>
      <input id="f_files" type="file" class="input" accept=".pdf" />
      <div class="mt-2 text-[10px] text-slate-500">
        Astuce : le fichier sera enregistré dans Supabase avec le nom <strong>NUMERO.pdf</strong>
        dans le bucket Arrivées ou Départs selon le type.
      </div>
    </div>
  `;

  const actions = document.createElement("div");
  actions.className =
    "lg:col-span-4 md:col-span-3 flex justify-end gap-2 mt-2";
  actions.innerHTML = `
    <button type="button" class="btn" id="btnCancel">Annuler</button>
    <button type="button" class="btn btn-primary" id="btnSave">
      Enregistrer
    </button>
  `;
  grid.appendChild(actions);

  // Sync vers formulaire
  function syncToForm() {
    $("#f_numero",grid).value = f.numero || "";
    $("#f_date",grid).value = f.date || "";
    $("#f_objet",grid).value = f.objet || "";
    $("#f_instructions",grid).value = f.instructions || "";
    $("#f_service",grid).value = f.service || "";
    $("#f_priorite",grid).value = f.priorite || "Normal";
    $("#f_echeance",grid).value = f.echeance || "";
    $("#f_statut",grid).value = f.statut || "Reçu";
    $("#f_reference",grid).value = f.reference || "";
    $("#f_obs",grid).value = f.observation || "";
    $("#f_person",grid).value =
      (f.type === "entrant" ? f.expediteur : f.destinataire) || "";

    $("#lblPerson",grid).textContent =
      f.type === "entrant" ? "Expéditeur" : "Destinataire";

    const btnE = $("#btnEntrant",grid);
    const btnS = $("#btnSortant",grid);
    btnE.classList.remove("btn-active","btn-inactive");
    btnS.classList.remove("btn-active","btn-inactive");
    if (f.type === "entrant") {
      btnE.classList.add("btn-active");
      btnS.classList.add("btn-inactive");
    } else {
      btnS.classList.add("btn-active");
      btnE.classList.add("btn-inactive");
    }
  }

  grid.addEventListener("input", e => {
    const id = e.target.id;
    const v  = e.target.value;
    if (id === "f_numero") f.numero = v;
    if (id === "f_date") f.date = v;
    if (id === "f_objet") f.objet = v;
    if (id === "f_instructions") f.instructions = v;
    if (id === "f_reference") f.reference = v;
    if (id === "f_obs") f.observation = v;
    if (id === "f_person") {
      if (f.type === "entrant") f.expediteur = v;
      else f.destinataire = v;
    }
    if (id === "f_echeance") f.echeance = v;
    if (id === "f_service") f.service = v;
  });

  grid.addEventListener("change", e => {
    const id = e.target.id;
    const v  = e.target.value;
    if (id === "f_priorite") f.priorite = v;
    if (id === "f_statut") f.statut = v;
  });

  grid.addEventListener("click", e => {
    if (e.target.id === "btnEntrant") {
      f.type = "entrant";
      syncToForm();
    }
    if (e.target.id === "btnSortant") {
      f.type = "sortant";
      syncToForm();
    }
  });

  $("#btnCancel",grid).onclick = () => {
    const m = document.getElementById("__modal");
    if (m) m.remove();
  };

  $("#btnSave",grid).onclick = async () => {
    if (!f.objet || !f.date) {
      alert("Merci de saisir au minimum la date et l'objet.");
      return;
    }

    const saved = await saveCourrierToSupabase(f);
    if (!saved) return;

    const fileInput = $("#f_files",grid);
    await uploadAttachmentIfAny(saved, fileInput);

    const m = document.getElementById("__modal");
    if (m) m.remove();

    await loadCourriersFromSupabase();
  };

  syncToForm();
  openModal(initial ? "Modifier le courrier" : "Nouveau courrier", grid);
}

/* ============================
   BOUTONS GLOBAUX & FILTRES
   ============================ */

const btnUser = document.getElementById("btnUser");
if (btnUser) {
  btnUser.onclick = () => loginUser();
}

const btnNew = document.getElementById("btnNew");
if (btnNew) {
  btnNew.onclick = () => {
    if (CAN_EDIT) openForm(null);
  };
}

const btnImport = document.getElementById("btnImport");
if (btnImport) {
  btnImport.onclick = () => {
    alert("Import JSON désactivé dans cette version (les données viennent de Supabase).");
  };
}

const btnExportPDF = document.getElementById("btnExportPDF");
if (btnExportPDF) {
  btnExportPDF.onclick = () => window.print();
}

const searchInput = document.getElementById("search");
if (searchInput) {
  searchInput.oninput = () => renderAll();
}

const filterType = document.getElementById("filterType");
if (filterType) {
  filterType.onchange = () => renderAll();
}

const filterService = document.getElementById("filterService");
if (filterService) {
  filterService.onchange = () => renderAll();
}

const filterDate = document.getElementById("filterDate");
if (filterDate) {
  filterDate.onchange = () => renderAll();
}

/* ============================
   AU CHARGEMENT
   ============================ */

(async function init() {
  loginUser();
  if (!CURRENT_USER) {
    // si l'utilisateur ferme les prompts, on met en consultation
    CURRENT_USER = { name: "consult", canEdit: false };
    applyRole();
  }
  await loadCourriersFromSupabase();
})();
</script>
